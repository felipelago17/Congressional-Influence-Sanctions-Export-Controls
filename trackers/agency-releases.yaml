    label: DOJ press release — Supermicro-linked AI server diversion indictment (S.D.N.Y., 19 Mar 2026)
    agency: DOJ
    title_any: [super micro, supermicro, liaw, servers housing]
    search: Super Micro servers China indictment

  - id: earthmade-lui-indictment-2026-10
