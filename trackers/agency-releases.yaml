# Official DOJ / BIS / OFAC releases to resolve (scripts/fetch_agency_releases.py).
# Add a target when an enforcement-actions.yaml entry lacks an official URL.
# title_keywords: all must appear in the title (case-insensitive); title_any: at least one.
# search: query for the DOJ press-release search page when the RSS window is too short.

targets:
