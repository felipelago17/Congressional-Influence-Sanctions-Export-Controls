- id: bosch-bis-doj-2026-06
  date: 2026-06-17
  type: administrative-settlement + criminal-declination
  instrument: BIS settlement order (16 Jun 2026) and DOJ NSD declination letter (15 Jun 2026) under the Department-wide CEP, Part I
  agencies: [BIS, DOJ National Security Division (CES)]
  company: Robert Bosch GmbH (Germany)
  programs: [export controls — Entity List (Huawei), Foreign Direct Product Rule]
  conduct: >
    16 Sep 2020 – 26 Sep 2024: c. $72.4m of MEMS sensors, phone and automotive software,
    foreign-produced but subject to the EAR under the FDPR, exported from abroad by two
    non-U.S. subsidiaries to Huawei and affiliates on the Entity List without a licence;
    109 EAR violations charged. Supplier certifications referencing the FDPR and the Seagate
    precedent were signed without recognising the exposure; compliance team confused the
    de minimis rule with the FDPR.
  amounts:
    bis_penalty_usd: 36184680
    bis_suspended_usd: 3600000      # credited for the DOJ disgorgement
    doj_disgorgement_usd: 11400000  # pre-tax profits; partially suspended, c. $3.6m paid
  terms: {voluntary_self_disclosure: true, declination_part: "CEP Part I (timely VSD, full cooperation, remediation)"}
  status: {announced: 2026-06-17, published: 2026-06-17, in_force: true}
  sources:
    - "https://www.bis.gov/press-release/robert-bosch-gmbh-bosch-pay-36-million-penalty-bis-violations-pertaining-shipments-huawei"
    - "https://www.bis.gov/media/documents/robert-bosch-gmbh-final-order-6-16-2026.pdf"
    - "https://www.globalsecurity.org/military/library/news/2026/06/mil-260617-doj01.htm"
  secondary_sources:
    - "https://www.sullcrom.com/insights/memo/2026/June/DOJ-Announces-First-NSD-Declination-Under-Revised-CEP"
    - "https://www.foleyhoag.com/news-and-insights/blogs/white-collar-law-and-investigations/2026/june/bosch-and-the-foreign-direct-product-rule-lessons-for-companies-manufacturing-using-u-s-technology/"
  linkage: none-documented
  notes: "First NSD declination under the March 2026 CEP and DOJ's second overall (after Balt SAS, Fraud Section, 19 Mar 2026). Apparently the first DOJ action built on the FDPR. Disclosure during an ongoing internal investigation was treated as timely — the contrast case for Extreme Networks' near-miss NPA."

