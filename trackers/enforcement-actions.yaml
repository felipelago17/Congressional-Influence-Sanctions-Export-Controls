    - "https://ofac.treasury.gov/civil-penalties-and-enforcement-information"
  linkage: none-documented
  notes: "Settlement equals the base penalty with no reduction; OFAC credited a tolling agreement but found no net mitigation. FinCEN's $1.2bn (third largest ever) and OCC's record $750m concern BSA/AML failures — Chinese money-laundering networks and south-west border illicit finance — not sanctions."

