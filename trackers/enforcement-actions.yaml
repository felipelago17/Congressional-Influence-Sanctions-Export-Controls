- id: bank-of-america-ofac-2026-10
  date: 2026-10-13
  type: civil-settlement
  instrument: OFAC settlement (parallel FinCEN and OCC penalties same day)
  agencies: [OFAC, FinCEN, OCC]
  company: Bank of America, N.A.
  programs: [Russia, Belarus, Iran, Burma, Somalia, counter-narcotics, global terrorism]
  conduct: 475 apparent violations across seven programmes; non-egregious; 413 not voluntarily self-disclosed, 62 self-disclosed.
  amounts:
    ofac_settlement_usd: 11662930
    fincen_penalty_usd: 1200000000
    occ_penalty_usd: 750000000   # credited toward the FinCEN amount
  status: {announced: 2026-10-13, published: 2026-10-13, in_force: true}
