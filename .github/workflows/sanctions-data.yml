name: Sanctions List Data

on:
  schedule:
    - cron: '40 7 * * *'   # daily 07:40 UTC (OpenSanctions exports refresh overnight)
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_sanctions_data.py'

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  sanctions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch OpenSanctions statistics and new listings
        run: python scripts/fetch_sanctions_data.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data docs/trackers 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: sanctions lists $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push
