site_name: Congressional Influence on Sanctions and Export Controls
site_description: Evidence-based mapping of public congressional signals to administration actions on sanctions and export controls.
site_author: Felipe Villasuso Lago
repo_url: https://github.com/felipelago17/Congressional-Influence-Sanctions-Export-Controls
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
nav:
  - Home: index.md
  - Methodology:
      - Linkage Grades: methodology/linkage-grades.md
      - Source Hierarchy: methodology/source-hierarchy.md
  - Influence:
      - Administration Levers: influence/administration-levers.md
      - Party and Committee Aggregates: influence/party-committee-aggregates.md
      - Election Cycles: influence/election-cycles.md
  - OFAC and Tariffs:
      - Overview: ofac-tariffs/index.md
      - Case Studies: ofac-tariffs/case-studies.md
      - Research and Publications: ofac-tariffs/research.md
  - Trackers:
      - Congressional Signals (Congress.gov): trackers/congress-signals.md
      - Presidential Documents (Federal Register): trackers/presidential-documents.md
      - Agency Enforcement Releases (DOJ/BIS/OFAC): trackers/agency-releases.md
      - Sanctions Lists (OpenSanctions): trackers/sanctions-data.md
      - Enforcement Actions: trackers/enforcement-actions.md
  - Analysis:
      - "Sanctions Drop #18 — Democrats take Congress (Nov 2026)": analysis/sanctions-drop-18-democrats-take-congress.md
      - "Dow Jones Risk Journal — Tweaks, not major change (Nov 2026)": analysis/dj-risk-journal-tweaks-not-major-change.md
      - "Al Jazeera — Democrats win Congress, provisional results (Nov 2026)": analysis/aljazeera-democrats-win-congress.md
      - "Cross-source check — 2026 midterms (Nov 2026)": analysis/midterms-2026-cross-source-check.md
      - "Related — AI Daily Brief, midterms and AI (Nov 2026)": analysis/ai-daily-brief-midterms-and-ai.md
  - News:
      - Daily Digest: news/digest.md
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
